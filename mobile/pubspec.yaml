name: Hearteli
description: Hearteli consent-based human support app
publish_to: 'none'
version: 1.0.6+11

environment:
  sdk: '>=3.7.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  http: ^1.2.2
  shared_preferences: ^2.3.2
  flutter_secure_storage: ^9.2.4
  url_launcher: ^6.3.0
  visibility_detector: ^0.4.0+2
  cupertino_icons: ^1.0.8
  firebase_core: ^3.8.0
  firebase_messaging: ^15.1.5
  intl: ^0.20.2
  timezone: ^0.10.1
  qr_flutter: ^4.1.0
  mobile_scanner: ^7.5.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/brand/
  fonts:
    - family: Nunito
      fonts:
        - asset: assets/fonts/Nunito-Variable.ttf
